<!doctype html>
<!-- A frame of an exact width for the screen check. Headless Chrome will not
     make a window narrower than 500 pixels, so a phone width is shown inside
     this page instead. The kit serves it at /__frame, in stand-in mode only.
     Usage: /__frame?w=390&h=1400&src=/?probe=1 -->
<meta charset="utf-8">
<title>Imagine Kit screen check frame</title>
<style>html, body { margin: 0; background: #000; } iframe { border: 0; display: block; }</style>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.createElement('iframe');
  f.width = q.get('w') || 390; f.height = q.get('h') || 1400; f.src = q.get('src');
  document.body.appendChild(f);
  addEventListener('message', e => {
    if (!e.data || !e.data.probe) return;
    for (const [k, v] of Object.entries(e.data.probe)) document.body.dataset[k] = v;
  });
</script>
</body>
