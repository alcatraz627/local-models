note = "Without it the first answer after a pause takes about 5 s while the model loads. Nothing stays loaded on its own."
inputs = "a duration such as 1h or 30m, or 'off'"
output = "a line saying what is loaded and when it unloads"
exit_codes = "0 done, 2 bad duration, 10 server down, 11 model missing"
cost_tier = "small"
cost_secs = "5 (loads the small model once)"
leaves_mac = false
side_effects = "loads the small model and holds about 5 GB of memory until the lease ends or you run lm fast off"
keywords = ["keep the model loaded", "keep answers instant", "warm up the model", "instant answers", "make it faster"]
see_also = ["status", "warm"]
next = ""
examples = [
  { cmd = "lm fast 1h", says = "q answers in under a second until the time it prints" },
  { cmd = "lm fast off", says = "free the memory now", keywords = ["unload", "free memory"] },
  { cmd = "lm status", says = "what is loaded and when it unloads" },
]

[[job]]
name = "help"
kind = "job"
aliases = []
summary = "the steps for one job"
usage = "lm help [job]"
front_label = "lm help <job>"
front_says = "the steps for one job: ask, cmd, doc, read, diff, count, again, find, web, fast, failed"
help_says = "the list of jobs"
more_label = "lm help <job>"
more_says = "short route from a job to the right command"
inputs = "a job name, or nothing for the list"
output = "a short screen of steps for that job"
exit_codes = "0 shown, 2 unknown job"
cost_tier = "no model"
cost_secs = "under 1"
leaves_mac = false
side_effects = "none"
keywords = ["help with a job", "how do i use lm", "list the jobs", "what can lm do"]
see_also = ["how", "more", "examples"]
next = ""
