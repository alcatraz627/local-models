keywords = ["what is using memory", "memory", "what is loaded", "free memory", "is the server up", "what models are running"]
see_also = ["models", "doctor", "fast"]
next = ""
examples = [
  { cmd = "lm status", says = "server, free memory, loaded models, when they unload" },
