# The one registry of what lm can do. Everything a person or an agent reads about lm is generated
# from this file: the lm screens, lm --capabilities, lm how, completion, man pages, tldr pages and
# the front-door block in docs/CAPABILITIES.md. Edit here, then run scripts/gen-verbs.sh.
# probe/fixtures/verbs-drift.py fails when anything drifts.
#
# Job fields
#   name, kind (job | tool | topic), aliases, summary (a person's one-liner), usage
#   examples = [{cmd, says, section?, cloud?, keywords?}]    section defaults to START
#   note              the gray closing line of `lm help <job>`
#   inputs, output, exit_codes, cost_tier, cost_secs, leaves_mac, side_effects
#   keywords          phrases `lm how` matches against; the first one is the job's own best phrase
#   see_also          other job names
#   front_label/front_says, more_label/more_says, help_says   one line on the lm, lm more, lm help screens

version = 1

[conventions]
json_flag = "--json on q, see, lm status|models|doctor|timeline, warm status, lm how, lm --capabilities: one JSON object (or array) on stdout, no colour"
exit_codes = { "0" = "success", "1" = "the work ran and failed, or a check failed", "2" = "bad usage: unknown flag, missing value, unknown verb", "10" = "server down or a backend call failed", "11" = "model or backend not available", "12" = "input missing or unreadable (file, image, history entry, optional dependency)", "13" = "wall-clock timeout", "127" = "a required program is not installed", "130" = "cancelled by the caller" }
history_scope = "q, see and lm history default to calls from your own terminal. A caller with no terminal (an agent, hook or cron job) has no 'mine': pass --all or set LM_ALL=1 to reach the newest row."
no_tty_behaviour = "No colour, no gray hints, no prompts. Scripted forms (flags, --json, pipes) behave the same with or without a terminal. Error envelopes in --json mode are {ok:false, code, message, remedy, next}: branch on code, not on message."

[screens]
front_title = "local models on this Mac (nothing leaves the machine unless marked ☁)"
front_jobs = ["ask", "cmd", "read", "diff", "doc", "again", "find", "review"]
front_handy = ["status", "fast", "how", "help", "more"]
front_footer = "☁ marks a call that leaves this Mac. Every command takes -h."
help_index = ["ask", "cmd", "doc", "read", "diff", "count", "again", "find", "web", "fast", "status", "failed"]
help_index_note = "Also: lm help json | table | gemini | review | imagine | batch | retrieval. Tool help: lm help q|see|imagine|review|warm|probe|ui-verify|index|bench. Everything with examples: lm examples"
more_title = "local-model toolkit with an optional connected Gemini lane"
more_order = ["q", "imagine", "see", "review", "probe", "fleet", "opencode", "index", "gemini", "ui-verify", "rag", "warm", "status", "models", "doctor", "timeline", "last", "examples", "how", "help", "bench"]
more_examples = [
  { cmd = 'lm q cmd "free up port 3001"', says = "one macOS command" },
  { cmd = "lm q summarize --file report.pdf", says = "read a local file (no cloud)" },
  { cmd = 'lm q --big "reason through this"', says = "heavier on-demand model" },
  { cmd = "git diff | lm q commit", says = "commit message from the diff" },
  { cmd = 'lm imagine --enhance "a cozy reading nook"', says = "" },
  { cmd = 'lm imagine refine 12 "warmer light"', says = "iterate on generation 12" },
  { cmd = "lm models   ·   lm status   ·   lm doctor", says = "what is installed / running / healthy" },
  { cmd = "lm warm on", says = "pin the small model — q is then sub-second" },
]
more_footer = [
  "per-command help (every flag + examples):  {c}lm help <verb>{r}, or {c}<verb> -h{r} for q, see, imagine, review, warm, gemini, fleet",
  "the full menu with examples:  {c}glow ~/Code/local-models/docs/CAPABILITIES.md{r}",
  "{d}docs: ~/Code/local-models/docs/  (STATE · CAPABILITIES · q-spec · 03-tool-orchestration-decision · research){r}",
]

[how]
cloud_triggers = ["web", "gemini", "internet", "online", "google", "news", "research", "browse", "current"]
stopwords = ["a", "an", "the", "my", "me", "i", "of", "to", "for", "on", "in", "is", "are", "it", "that", "this", "these", "those", "what", "how", "do", "does", "with", "from", "and", "or", "please", "can", "you", "want", "so", "about", "at", "be", "get", "some", "if", "when"]
synonyms = [
  ["latest", "last", "newest", "recent"],
  ["big", "bigger", "larger", "heavier"],
  ["image", "screenshot", "picture", "photo", "png", "pic"],
  ["before", "yesterday", "earlier", "previous", "past", "old", "ago"],
  ["instant", "quick", "snappy", "fast"],
  ["file", "document", "pdf"],
  ["change", "changed", "differ", "different", "difference", "compare", "diff"],
  ["review", "audit"],
]
threshold = 3.0

# What a gray `next:` line says after an answer. The text is the command to run.
[hints]
small_answer = { text = "lm again --big", why = "not right? the bigger model" }
truncated = { text = "--max-ctx {n}", why = "only part of the file was read" }
low_confidence = { text = "see {img} --ocr", why = "the vision model was unsure: read the exact text" }
repeat = { text = "lm again", why = "the same question twice gives the same answer: try a stronger model" }

# Where a failed call points next. {code} is the error code in the --json envelope.
[remedies]
server_down = { remedy = "the local server was stopped; it restarts on the next call, or run lm doctor", next = "lm doctor" }
model_missing = { remedy = "that model is not installed; lm models lists what is", next = "lm models" }
timeout = { remedy = "it took too long; try a smaller input or a longer --timeout", next = "" }
ctx_required = { remedy = "that intent needs a file; add --ctx FILE", next = "" }
ctx_unreadable = { remedy = "the file could not be read; check the path", next = "" }
ctx_empty = { remedy = "the file has no text in it; check the path or extract text first", next = "" }
ctx_binary = { remedy = "the file is binary; extract its text first", next = "" }
ctx_unsupported = { remedy = "that file type cannot be read directly; convert it to text or csv first", next = "" }
ctx_too_large = { remedy = "the file is too big; cut it down or use lm gemini --file", next = "lm gemini --file FILE" }
ctx_truncated = { remedy = "the table is larger than the read limit; narrow it or raise --max-ctx", next = "" }
format_unreadable = { remedy = "the schema file is missing; check the --format path", next = "" }
format_invalid = { remedy = "the schema file is not valid JSON", next = "" }
sheet_missing = { remedy = "that sheet is not in the workbook; list them with --preflight", next = "q --preflight --ctx FILE --json" }
judge_required = { remedy = "this intent needs a === JUDGE === section with a runnable check in the context", next = "" }
invalid_args = { remedy = "a flag or argument was wrong; the message says which, and -h lists them", next = "" }
no_such_entry = { remedy = "there is no such history entry; list yours first", next = "lm timeline" }
cancelled = { remedy = "it was cancelled before it finished", next = "" }
mlx_failed = { remedy = "the MLX read failed; run it again, or add -m minicpm-v4.6", next = "" }
mlx_venv_missing = { remedy = "the project venv is missing; mlx-vlm lives in it", next = "lm doctor" }
model_error = { remedy = "the vision model failed; run it again, or lm doctor", next = "lm doctor" }
ocr_missing = { remedy = "install the text reader: npm install -g mac-ocr", next = "npm install -g mac-ocr" }
ocr_failed = { remedy = "the text reader failed on that image; try again, or read it with the model", next = "" }
measure_failed = { remedy = "the pixel measurement failed on that image; check it opens normally", next = "" }
vlm_unavailable ={ remedy = "the model read was skipped; the measured evidence is still complete", next = "" }
img_unreadable = { remedy = "the image could not be found; check the path", next = "lm read latest" }
not_an_image = { remedy = "that file is not an image; check the path", next = "" }
clipboard_empty = { remedy = "copy a screenshot first (Cmd-Ctrl-Shift-4), or read your newest saved one", next = "lm read latest" }
crop_failed = { remedy = "the crop could not be made; check the image and the window", next = "" }
capture_failed = { remedy = "the screen capture produced nothing; allow Screen Recording for your terminal", next = "" }
no_screencapture = { remedy = "screen capture only works on macOS", next = "" }
rerun_failed = { remedy = "the re-run of that extractor failed; run the diff without --only", next = "" }
item_missing = { remedy = "an input file or directory was not found; check the path", next = "" }
items_unreadable = { remedy = "the list of items could not be read; check the path", next = "" }
no_items = { remedy = "give some files, or a list with --items-from", next = "lm fleet -h" }
unknown_intent = { remedy = "there is no intent by that name; q intents lists them", next = "q intents" }
load_failed = { remedy = "the model did not load; check what is installed and free memory", next = "lm status" }
worker_died = { remedy = "a worker produced nothing; run again, or check the server", next = "lm doctor" }
gemini_unavailable = { remedy = "gemini is not available; check the key in ~/.gemini/.env", next = "lm doctor" }
gemini_error = { remedy = "gemini ended without an answer; lm gemini show -1 has the steps", next = "lm gemini show -1" }
bad_model = { remedy = "that gemini model is not in the list; lm gemini models shows it", next = "lm gemini models" }
repomix_missing = { remedy = "install the repo packer: npm install -g repomix", next = "npm install -g repomix" }
repomix_failed = { remedy = "the repo could not be packed; check the directory", next = "" }
venv_missing = { remedy = "the project venv is missing; see the setup notes", next = "lm doctor" }
secrets_found = { remedy = "secret-looking text was found; clean those files before indexing", next = "" }
no_index = { remedy = "nothing is indexed yet; build the index first", next = "lm rag index docs/" }
search_failed = { remedy = "retrieval failed; check the index with lm rag status", next = "lm rag status" }
answer_failed = { remedy = "the answer step failed; try again, or check the server", next = "lm doctor" }
ax_missing = { remedy = "install the accessibility reader: cargo install --git https://github.com/watzon/ax-cli", next = "" }
ax_failed = { remedy = "the accessibility tree could not be read; check the app name", next = "" }
img_unreadable_ui = { remedy = "the screenshot could not be found; check the path", next = "" }
inventory_failed = { remedy = "the UI read failed; try see --ui on the image directly", next = "" }
judge_failed = { remedy = "the judge call failed; try again, or check the server", next = "lm doctor" }
judge_incomplete = { remedy = "the judge did not rule on every claim; try again or use fewer claims", next = "" }

# ───────────────────────────── daily jobs ─────────────────────────────

[[job]]
name = "ask"
kind = "job"
aliases = []
summary = "a quick answer from the small local model"
usage = 'lm "question"'
delegate = "q"
front_label = 'lm "question"'
front_says = 'answer; an image path, a file or "gemini ..." in it routes itself'
help_says = "get a quick answer"
more_label = ""
note = "Wrong or thin answer? lm help again. A question about something current? lm help web."
inputs = "a question as text; an image or file path inside it is routed for you"
output = "plain text answer on stdout; with q --json: {ok, text, model, ms, ...}"
exit_codes = "0 answered, 2 bad usage, 10 server down, 11 model missing, 13 timeout"
cost_tier = "small"
cost_secs = "2-5 (about 5 s on the first call after a pause)"
leaves_mac = false
side_effects = "loads the small model, writes logs/q-history.jsonl"
keywords = ["quick answer", "ask a question", "ask the model", "explain", "how do i", "what does this mean"]
see_also = ["fast", "again", "cmd"]
next = "small_answer"
examples = [
  { cmd = 'lm "how do I see what is using port 5432"', says = "the answer comes back in a few seconds" },
  { cmd = "lm fast 1h", says = "the first answer after a pause takes about 5 s; this keeps it instant" },
  { cmd = 'lm "what text is in ~/Desktop/shot.png"', says = "an image path in the question goes to the image reader" },
]

[[job]]
name = "cmd"
kind = "job"
aliases = []
summary = "one shell command, checked before you run it"
usage = 'lm cmd "task"'
delegate = "q"
front_label = 'lm cmd "task"'
front_says = "one shell command, checked against the tool's own --help"
help_says = "get one shell command you can trust"
note = "It checks that the program exists and that each --flag appears in its own --help, then prints a gray line saying what it found. It never runs the command. A flag it cannot find means the model guessed: lm again --web."
inputs = "a task described in words"
output = "the command and nothing else on stdout; a gray line on stderr says what was checked"
exit_codes = "0 produced, 2 bad usage, 10 server down, 13 timeout"
cost_tier = "small"
cost_secs = "2-5"
leaves_mac = false
side_effects = "loads the small model, writes logs/q-history.jsonl; never runs the command it prints"
keywords = ["shell command", "terminal command", "command line for", "one-liner", "give me a command", "how do i run"]
see_also = ["ask", "again"]
next = "small_answer"
examples = [
  { cmd = 'lm cmd "list the 5 largest files in ~/Downloads"', says = "prints the command and nothing else" },
  { cmd = 'q check "ls -lah --sort=size"', says = "check a command you already have, without running it", keywords = ["check this command"] },
]

[[job]]
name = "read"
kind = "job"
aliases = ["screenshot", "ui", "ocr", "text"]
summary = "text or an answer out of an image"
usage = 'lm read <img|paste|latest> ["q"]'
delegate = "see"
front_label = 'lm read <img|paste|latest> ["q"]'
front_says = "text or an answer from an image (exact text is read first)"
help_says = "get the text or an answer out of an image or screenshot"
note = "Exact readers (text, counts) run first; the vision model only adds what they cannot see."
inputs = "an image path, 'paste' (the clipboard image) or 'latest' (the newest screenshot), plus an optional question"
output = "plain text; with --json one object: {ok, text, model, ms, evidence}; with --ui --json the parsed element list under .data"
exit_codes = "0 read, 2 bad usage, 12 image or clipboard empty, 10/11 vision model failed or missing, 13 timeout"
cost_tier = "vision"
cost_secs = "1 (--ocr) to 30 (cold vision model)"
leaves_mac = false
side_effects = "loads a vision model, reads the clipboard for 'paste', writes logs/see-history.jsonl and outputs/see/"
keywords = ["text from a screenshot", "read an image", "read the screenshot", "ocr", "what does the picture say", "read latest screenshot"]
see_also = ["diff", "count", "ui-verify"]
next = "low_confidence"
examples = [
  { cmd = "lm read shot.png", says = "what is in the image" },
  { cmd = 'lm read shot.png "what is the build id?"', says = "asks for text, IDs and numbers are read exactly first" },
  { cmd = "lm read paste", says = "the screenshot on your clipboard (Cmd-Ctrl-Shift-4)", keywords = ["clipboard"] },
  { cmd = "lm read latest", says = "your newest screenshot file", keywords = ["last screenshot", "newest screenshot", "latest screenshot"] },
  { cmd = "see shot.png --ocr", says = "just the exact text, about a second", keywords = ["exact text", "ocr"] },
  { cmd = "see shot.png --ui --json", says = "a structured list of the buttons and labels", keywords = ["buttons", "ui elements"] },
  { cmd = 'lm ui-verify shot.png "Save is disabled"', says = "check one claim about a screenshot", keywords = ["verify a claim"] },
]

[[job]]
name = "diff"
kind = "job"
aliases = ["compare"]
summary = "what changed between two images"
usage = "lm diff A B"
delegate = "see"
front_label = "lm diff A B"
front_says = "what changed between two images, and where"
help_says = "see what changed between two images"
note = "The summary is measured from the pixels. A vision model adds its own read when one is free; judging whether the change matters is yours."
inputs = "two image paths, and an optional focus phrase"
output = "a three-line plain summary (where, whether text changed, whether colours changed) and a heatmap; --json adds the full evidence pack"
exit_codes = "0 compared, 2 bad usage, 12 image missing or not an image"
cost_tier = "no model"
cost_secs = "1-3 (plus a vision read if memory allows)"
leaves_mac = false
side_effects = "writes logs/see-history.jsonl and outputs/see/"
keywords = ["what changed between two images", "compare two screenshots", "before and after", "difference between images"]
see_also = ["read", "count"]
next = ""
examples = [
  { cmd = "lm diff before.png after.png", says = "a three-line summary: where, whether text changed, whether colours changed" },
  { cmd = "see diff a.png b.png --no-read --json", says = "the measured evidence only, no model" },
]

[[job]]
name = "doc"
kind = "job"
aliases = ["document", "qa"]
summary = "ask about, or summarize, a file"
usage = 'lm doc <file> ["q"]'
delegate = "q"
front_label = 'lm doc <file> ["q"]'
front_says = "ask about or summarize a file (says how much of it was read)"
help_says = "ask about, or summarize, a file"
note = "It tells you how much of the file it read. A long file is cut at 16,000 characters: raise it with --max-ctx 40000, or use cat file | lm gemini \"...\" (the file leaves this Mac)."
inputs = "a file (PDF, Word, HTML, text, spreadsheet) and an optional question"
output = "plain text answer, plus a gray line saying how much of the file was read"
exit_codes = "0 answered, 2 bad usage, 12 file missing or unreadable, 10/11 server or model, 13 timeout"
cost_tier = "small"
cost_secs = "3-15 depending on file size"
leaves_mac = false
side_effects = "loads the small model, extracts text locally, writes logs/q-history.jsonl"
keywords = ["summarize a file", "summarise this document", "ask about a file", "what does this pdf say", "read this report", "tldr of a file"]
see_also = ["ask", "gemini", "rag"]
next = "truncated"
examples = [
  { cmd = "lm doc report.pdf", says = "a summary (PDF, Word, HTML, text, spreadsheets)" },
  { cmd = 'lm doc report.pdf "what is the decision?"', says = "an answer grounded in the file" },
  { cmd = "q --preflight --ctx report.pdf", says = "how big the file is, before asking" },
]

[[job]]
name = "again"
kind = "job"
aliases = ["retry"]
summary = "the answer was wrong; ask the same thing on a stronger model"
usage = "lm again [--big|--code|--web]"
delegate = "q"
front_label = "lm again [--big|--web]"
front_says = "redo your last question on a stronger model (--web leaves this Mac ☁)"
help_says = "the answer was wrong: try again, stronger"
note = "Answers are deterministic: asking the same thing twice gives the same answer, so retyping never helps."
inputs = "none; it takes your last question from this terminal's history"
output = "a new answer on a stronger lane, in the same shape as q"
exit_codes = "0 answered, 2 bad usage, 12 no earlier call from this terminal, 10/11/13 as for q"
cost_tier = "big"
cost_secs = "10-40 (loads the big model)"
leaves_mac = false
side_effects = "loads a bigger model, writes logs/q-history.jsonl; --web sends the question off this Mac"
keywords = ["redo", "try again", "answer was wrong", "stronger model", "bigger model", "wrong answer", "thin answer"]
see_also = ["ask", "web"]
next = "repeat"
examples = [
  { cmd = "lm again", says = "your last question, one step stronger (small, then big)", keywords = ["stronger"] },
  { cmd = "lm again --big", says = "the bigger reasoning model", keywords = ["bigger model", "reasoning"] },
  { cmd = "lm again --code", says = "the coding model", keywords = ["coding model"] },
  { cmd = "lm again --web", says = "search the web first (the question leaves this Mac)", cloud = true },
  { cmd = 'q -c "and sorted by size?"', says = "a follow-up that continues your last exchange", keywords = ["follow up", "continue"] },
]

[[job]]
name = "find"
kind = "job"
aliases = ["history", "retrieval-history"]
summary = "search the answers you got before"
usage = 'lm find "words"'
front_label = 'lm find "words"'
front_says = "search your past answers"
help_says = "find an answer you got before"
note = "Open one with the handle it prints: q show 3689, see show 1433."
inputs = "one or more words; all must appear"
output = "rows like q#3689  10-21 09:12  question  → first line of the answer; yours first, others dimmed"
exit_codes = "0 searched (even with no match), 2 bad usage"
cost_tier = "no model"
cost_secs = "under 1"
leaves_mac = false
side_effects = "reads the history files only"
keywords = ["find an answer i got before", "search past answers", "search my history", "what did i ask", "old answer"]
see_also = ["timeline", "last"]
next = ""
examples = [
  { cmd = 'lm find "port 5432"', says = "matching questions and answers across q, see, gemini and imagine, yours first" },
  { cmd = "lm timeline 15", says = "your last 15 calls, newest last" },
  { cmd = "lm timeline --all", says = "include agents and hooks (dimmed)" },
  { cmd = "lm last", says = "your latest call, in full" },
]

[[job]]
name = "review"
kind = "job"
aliases = []
summary = "review code, a PR or your uncommitted changes"
usage = "lm review [PR|files|dir]"
front_label = "lm review"
front_says = "review your uncommitted changes (a few minutes, on the code model)"
help_says = "review code, a PR or your uncommitted changes"
more_label = "lm review <x>"
more_says = "review a PR / files / folder / diff (local coder)"
note = "More flags: review -h"
inputs = "nothing (uncommitted changes), a PR number, files or a folder"
output = "a prose review; with --findings a schema-valid list of findings"
exit_codes = "0 reviewed, 1 failed, 2 bad usage, 3 no structured findings after a retry, 12 input missing"
cost_tier = "code"
cost_secs = "120-300 (loads the 23 GB code model)"
leaves_mac = false
side_effects = "loads the code model (23 GB), reads git state, writes logs/q-history.jsonl"
keywords = ["review my changes", "code review", "review a pr", "review uncommitted changes", "check my diff"]
see_also = ["fleet"]
next = ""
examples = [
  { cmd = "lm review", says = "your uncommitted changes (takes a few minutes; loads the 23 GB code model)" },
  { cmd = "review 214", says = "a GitHub PR", keywords = ["pr"] },
]

# ───────────────────────────── keep it handy ─────────────────────────────

[[job]]
name = "status"
kind = "job"
aliases = ["memory"]
